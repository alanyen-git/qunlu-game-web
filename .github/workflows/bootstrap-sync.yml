name: Bootstrap web release

on:
  push:
    paths:
      - '.github/workflows/bootstrap-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: alanyen-git/qunlu-game
          ref: main
          token: ${{ github.token }}
          path: source

      - name: Copy production game files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p target/assets/css target/src target/icons
          cp source/game_work/index.html target/index.html
          cp source/game_work/version.json target/version.json
          cp source/game_work/manifest.webmanifest target/manifest.webmanifest
          cp source/game_work/sw.js target/sw.js
          cp source/game_work/assets/css/game.css target/assets/css/game.css
          cp source/game_work/src/bootstrap.js target/src/bootstrap.js
          cp source/game_work/src/game-data.js target/src/game-data.js
          cp source/game_work/src/data-patches.js target/src/data-patches.js
          cp source/game_work/src/runtime.js target/src/runtime.js
          cp source/game_work/src/runtime-patches.js target/src/runtime-patches.js
          cp source/game_work/src/pwa.js target/src/pwa.js
          cp source/game_work/icons/icon-192.png target/icons/icon-192.png
          cp source/game_work/icons/icon-512.png target/icons/icon-512.png
          touch target/.nojekyll

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json manifest.webmanifest sw.js assets src icons .nojekyll
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Publish current game release"
          git push origin HEAD:main
