name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "version.json"
      - "src/**"
      - "assets/**"
      - "icons/**"
      - "scripts/build-mobile.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Package offline Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Stage shared game runtime
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npm run cap:sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: qunlu-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
