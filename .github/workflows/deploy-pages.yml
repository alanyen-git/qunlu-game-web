name: Validate and deploy public web game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate public release
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const version = JSON.parse(fs.readFileSync("version.json", "utf8"));
          JSON.parse(fs.readFileSync("manifest.webmanifest", "utf8"));
          const html = fs.readFileSync("index.html", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");

          const titleVersion = html.match(/<title>[^<]*(CURRENT-\d+\.\d+\.\d+)<\/title>/)?.[1];
          if (titleVersion !== version.version) {
            throw new Error(`version mismatch: index=${titleVersion} version.json=${version.version}`);
          }

          const refs = [
            ...[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m => m[1]),
            ...[...html.matchAll(/<link[^>]+href=["']([^"']+)["']/g)].map(m => m[1])
          ].map(value => value.split("?")[0]).filter(value => !/^https?:/.test(value));

          for (const ref of refs) {
            if (!fs.existsSync(path.normalize(ref))) throw new Error(`missing index resource: ${ref}`);
          }

          for (const match of sw.matchAll(/["']\.\/([^"']+)["']/g)) {
            const ref = match[1];
            if (!ref || ref === "." || ref.endsWith("/")) continue;
            if (!fs.existsSync(path.normalize(ref))) throw new Error(`missing service-worker resource: ${ref}`);
          }

          const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m => m[1]);
          for (const src of scripts) {
            if (src.startsWith("src/") && !src.includes(`v=${version.version}`)) {
              throw new Error(`script cache version mismatch: ${src}`);
            }
          }

          if (!html.includes("retro-battle-root")) {
            const runtime = fs.readFileSync("src/runtime.js", "utf8");
            if (!runtime.includes("retro-battle-root")) throw new Error("retro battle UI marker missing");
          }

          console.log(`release validation OK: ${version.version}; ${refs.length} index resources`);
          NODE

      - name: Stage production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js version.json _site/
          cp -R assets icons src _site/
          test -f _site/index.html
          test -f _site/src/runtime.js
          test -f _site/assets/css/game.css

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
