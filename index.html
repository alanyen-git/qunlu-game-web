<body>

<div id="gameUpdateBanner" class="update-banner hide"><b>發現新版本</b><span></span><button type="button" onclick="applyGameUpdate()">更新遊戲</button></div>
<div id="saveWarning" class="update-banner save-warning hide" role="alert"><b>本機存檔失敗</b><span>請檢查瀏覽器儲存空間，並先匯出存檔備份。</span><button type="button" onclick="exportSave()">匯出存檔</button></div>

<div class="top"><div class="topin"><div class="top-brand"><div class="title">群陸旅誌</div><div class="small top-subtitle">旅人的劍與魔法人生</div></div><div class="top-state-wrap"><div id="topState" class="small"></div></div></div></div>
<div class="wrap">
<div class="panel creation-shell" id="createPanel">
<h2>建立角色</h2><div class="small">全面整合成長、轉職、技能熟練、製作、副手武器／盾牌、狀態與戰鬥數值；所有重要變動實際寫回存檔並納入五回合稽核。</div>
<label for="nameInput">姓名</label><input id="nameInput" value="旅人" maxlength="24" autocomplete="off">
<div class="grid3">
<div class="card"><b>種族</b><p id="raceResult" class="small">尚未隨機</p><button type="button" onclick="rollRace()">隨機種族</button></div>
<div class="card"><b>出身</b><p id="originResult" class="small">尚未隨機</p><button type="button" onclick="rollOrigin()">隨機出身</button></div>
<div class="card"><b>元素親和</b><p id="elementResult" class="small">依種族＋出身自動隨機</p></div>
</div>
<hr><h3>戰鬥職業</h3><div class="actions"><button type="button" onclick="showClassSelect()">自選職業</button><button type="button" onclick="rollClass()">隨機職業</button></div>
<div id="classSelectBox" class="card hide"></div><div class="card"><b>目前職業：</b><span id="classResult">尚未決定</span><br><span id="randomCount" class="small">隨機剩餘10次</span></div><div class="card"><b>天賦候選池</b><div id="talentPreview" class="small">完成種族、出身與職業後顯示；建立角色時會從合適候選中無重複抽2個。</div></div>
<button type="button" class="primary" style="width:100%" onclick="createCharacter()">建立角色並開始</button>
</div>

<div class="panel game-shell hide" id="gamePanel">
<div class="journey-hero" aria-label="群陸旅誌旅途橫幅">
  <div class="journey-hero-caption">旅途未竟，群陸在前</div>
  <div class="journey-hero-note">原創世界意象・網頁版／本機存檔</div>
</div>
<div class="hud-meta hud-meta-compact">
  <div class="hud-meta-item flat"><div class="small">遊戲時間</div><div id="timeTop" class="time"></div></div>
  <div class="hud-meta-item flat"><div class="small">位置</div><div id="locTop"></div></div>
  <div class="hud-meta-item flat"><div class="small">回合</div><div id="turnTop"></div></div>
  <div id="moneyTop" class="money-nowrap hide" aria-hidden="true"></div>
</div>
<section class="hud-section"><div id="statusSummary" aria-live="polite" aria-atomic="true"></div></section>
<section class="journal-section" aria-live="polite">
  <div class="section-title"><h3>旅誌紀錄</h3></div>
  <div id="log" class="log journal-log" role="log" aria-relevant="additions text"></div>
</section>
<section class="play-section" id="playSection">
  <div class="section-title"><h3>可用行動</h3><span class="small">依所在地與設施即時變化</span></div>
  <div id="actionButtons" class="actions action-grid"></div>
</section>
</div>
</div>

<nav class="nav hide" id="fixedNav" aria-label="遊戲主選單"><div class="navin navin-five">
<button type="button" data-nav="adventure" class="primary active" onclick="setNavActive(this);showAdventure()" aria-label="冒險"><span class="navico">◆</span><span>冒險</span></button>
<button type="button" data-nav="character" onclick="setNavActive(this);openCharacter()" aria-label="角色"><span class="navico">♟</span><span>角色</span></button>
<button type="button" data-nav="inventory" onclick="setNavActive(this);openInventory()" aria-label="背包"><span class="navico">▣</span><span>背包</span></button>
<button type="button" data-nav="quest" onclick="setNavActive(this);openQuestLog()" aria-label="委託"><span class="navico">✦</span><span>委託</span></button>
<button type="button" data-nav="more" onclick="setNavActive(this);openMoreMenu()" aria-label="更多"><span class="navico">•••</span><span>更多</span></button>
</div></nav>

<div id="battleBack" class="battleback hide">
  <div class="battlebox" role="dialog" aria-modal="true" aria-labelledby="battleTitle" tabindex="-1">
    <div class="small" id="battleTitle">戰鬥遭遇</div>
    <div id="battleBody"></div>
  </div>
  <div id="battleSkillPopup" class="battle-skill-popup hide" onclick="battleSkillPopupBackClose(event)">
    <div class="battle-skill-sheet" role="dialog" aria-modal="true" aria-labelledby="battleSkillPopupTitle" tabindex="-1">
      <div class="battle-skill-head"><b id="battleSkillPopupTitle">選擇技能</b><button type="button" class="x" onclick="closeBattleSkillPopup()" aria-label="關閉技能視窗">×</button></div>
      <div id="battleSkillPopupBody" class="battle-skill-body"></div>
    </div>
  </div>
</div>

<div id="modalBack" class="modalback hide" onclick="backClose(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modalgrab" aria-hidden="true"></div>
    <div class="modalhead">
      <div class="modaltitlewrap"><span id="modalIcon" class="modalicon" aria-hidden="true">◆</span><h2 id="modalTitle"></h2></div>
      <div class="modalhead-actions">
        <button type="button" id="modalBackBtn" class="modalbackbtn" onclick="modalGoBack()" aria-label="回上一頁">←</button>
        <button type="button" class="x" onclick="closeModal()" aria-label="關閉視窗">×</button>
      </div>
    </div>
    <div id="modalBody" class="modalbody"></div>
    <nav id="characterDock" class="character-dock" aria-label="角色快捷選單"></nav>
  </div>
</div>
